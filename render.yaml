services:
  - type: web
    name: ramesh-solar-services
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: COOKIE_NAME
        value: rss_admin_token
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: ADMIN_NAME
        value: Ramesh Solar Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
